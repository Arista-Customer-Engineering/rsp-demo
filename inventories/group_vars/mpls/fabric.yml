########################################################################################
# The minimum required configuration to construct an MPLS Fabric - No services
########################################################################################
fabric_name: mpls
dc_name: RSP
mgmt_interface_settings:
  interface: "Management0"
  vrf: "OOB"
mgmt_destination_networks: ["0.0.0.0/0"]
mgmt_gateway: "{{ lab_settings.mgmt_gateway }}"

# Underlay Settings - IS-IS & Segment Routing
underlay_routing_protocol: isis-sr
underlay_ipv6: false
isis_default_is_type: level-2
isis_default_circuit_type: level-2
isis_default_metric: 1000
isis_ti_lfa:
  enabled: true
  protection: "node"
  local_convergence_delay: 10000

# Overlay Settings - iBGP
overlay_routing_protocol: ibgp
evpn_overlay_bgp_rtc: true
bgp_as: 65000
bgp_mesh_pes: true
overlay_rt_type:
  admin_subfield: "bgp_as"
overlay_rd_type:
  admin_subfield: "overlay_loopback_ip"
bgp_peer_groups:
  evpn_overlay_peers:
    bfd: false
  rr_overlay_peers:
    bfd: false
  mpls_overlay_peers:
    bfd: false
  ipv4_underlay_peers:
    bfd: false

# fabric_sflow:
#   uplinks: true
#   downlinks: true
#   endpoints: true
#   l3_edge: true
#   core_interfaces: true
  # mlag_interfaces: true
  # l3_interfaces: true

sflow_settings:
  sample:
    rate: 8192
  destinations:
    - destination: 127.0.0.1
      vrf: default
  vrfs:
    - name: default
      source_interface: Loopback0

custom_templates:
- cpu_traffic_policy.j2
  #- tcam.j2


eos_designs_custom_templates:
- template: underlay_connectivity.j2
  options:
    list_merge: prepend
    strip_empty_keys: false

########################################################################################
# Built-in Node Types
########################################################################################
pe:
  defaults:
    virtual_router_mac_address: 00:c1:00:00:00:11
    isis_sr:
      ipv4_node_sid_index_base: 0
    overlay_address_families: ["evpn"]
    is_type: level-2
    isis_system_id_prefix: '0000.0000'
    loopback_ipv4_pool: 172.16.0.0/24
    platform: "7280SR3"
    mpls_route_reflectors: ["ALPHA-EDGE-01", "BETA-EDGE-01"]
    # Revisit to simulate sFlow on vEOS / cEOS Labs
    raw_eos_cli: |
      platform tfa
        interface mode relaying

    filter:
      always_include_vrfs_in_tenants: ["Inband Management", "DHCP Relay"]
      only_vlans_in_use: true
  node_groups:
  - group: "Edge Routers"
    mpls_overlay_role: "server"
    evpn_role: "server"
    bgp_cluster_id: 172.16.0.0
    nodes:
    - name: "ALPHA-EDGE-01"
      id: 1
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "BETA-EDGE-01"
      id: 2
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
  - group: "Limited Routes"
    mpls_overlay_role: "client"
    evpn_role: "client"
    nodes:
    - name: "ALPHA-PE-01"
      id: 3
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "ALPHA-PE-02"
      id: 4
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "ALPHA-PE-03"
      id: 5
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "BETA-PE-01"
      id: 6
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
      # Per-node raw_eos_cli replaces (not merges with) pe.defaults.raw_eos_cli,
      # so the platform tfa block has to be repeated here too.
      raw_eos_cli: |
        dhcp relay
           ipv6 routes sync neighbor 172.17.0.3
        platform tfa
          interface mode relaying
    - name: "BETA-PE-02"
      id: 7
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
      raw_eos_cli: |
        dhcp relay
           ipv6 routes sync neighbor 172.17.0.2
        platform tfa
          interface mode relaying
    - name: "GAMMA-PE-01"
      id: 8
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "GAMMA-PE-02"
      id: 9
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
      raw_eos_cli: |
        dhcp relay
           ipv6 routes sync neighbor 172.17.0.6
        platform tfa
          interface mode relaying
    - name: "DELTA-PE-01"
      id: 10
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
      raw_eos_cli: |
        dhcp relay
           ipv6 routes sync neighbor 172.17.0.5
        platform tfa
          interface mode relaying
    - name: "DELTA-PE-02"
      id: 11
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "THETA-PE-01"
      id: 12
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"
    - name: "THETA-PE-02"
      id: 13
      mgmt_ip: "{{ ansible_host }}/{{ lab_settings.mgmt_cidr }}"

