#######################################################################################
# All Internet Services - Transits, Peering, PON Systems and Dedicated Internet
#######################################################################################
services_internet: # Network services key
  - name: "INTERNET"
    mac_vrf_id_base: 30000
    vrfs:
      - name: "INTERNET"
        structured_config:
          vrfs:
            - name: "INTERNET"
              ipv6_routing: true
          # router_general:
          #   control_functions:
          #     code_units:
          #       - name: INTERNET_FILTERS
          #         content: "{{ lookup('file', 'internet_filters.rcf') }}"
        description: "Public INTERNET VRF"
        address_families: ["evpn"]
        vrf_id: 30000
        redistribute_static: true
        vtep_diagnostic:
          loopback: 30
          loopback_description: "Internet Loopback"
          loopback_ip_range: "80.100.0.0/24"
          loopback_ipv6_range: "2001:db8:8000:30::/64"
          hardware_forwarding: true
        ############### SUMMARY ROUTE PINNING #################
        static_routes:
          - prefix: "80.0.0.0/16"
            interface: "null0"
            nodes: ["ALPHA-EDGE-01", "BETA-EDGE-01"]
            distance: 255
          - prefix: "81.0.0.0/16"
            interface: "null0"
            nodes: ["ALPHA-EDGE-01", "BETA-EDGE-01"]
            distance: 255
          - prefix: "82.0.0.0/16"
            interface: "null0"
            nodes: ["ALPHA-EDGE-01", "BETA-EDGE-01"]
            distance: 255
          ########### END OF SUMMARY ROUTE PINNING ###############
          ########### CUSTOMER STATIC ALLOCATIONS ################
          ########## END OF CUSTOMER STATIC ALLOCATIONS ##########
        ipv6_static_routes:
          ############### SUMMARY ROUTE PINNING #################
          - prefix: "0::0/0"
            interface: "null0"
            nodes: ["ALPHA-EDGE-01", "BETA-EDGE-01"]
            distance: 255
          - prefix: "2001:db8:8000::/33"
            interface: "null0"
            nodes: ["ALPHA-EDGE-01", "BETA-EDGE-01"]
            distance: 255
          - prefix: "0::0/0"
            interface: "null0"
            nodes: ["ALPHA-EDGE-01", "BETA-EDGE-01"]
            distance: 255
          ########### END OF SUMMARY ROUTE PINNING ###############
          ########### CUSTOMER STATIC ALLOCATIONS ################
          ########## END OF CUSTOMER STATIC ALLOCATIONS ##########
        ########################################################
        l3_interfaces:
          ############# Transit Peering Point to Points ############
          - nodes: ["ALPHA-EDGE-01"]
            interfaces: ["Ethernet1"]
            ip_addresses: ["198.51.100.1/31"]
            descriptions: ["TRANSIT-01 Peering"]
            structured_config:
              ipv6_enable: true
              ipv6_addresses:
                - "2601::1/127"
              ipv6_nd:
                ra:
                  disabled: true
          - nodes: ["ALPHA-EDGE-01"]
            interfaces: ["Ethernet2"]
            ip_addresses: ["198.51.100.3/31"]
            descriptions: ["TRANSIT-02 Peering"]
            structured_config:
              ipv6_enable: true
              ipv6_addresses:
                - "2602::1/127"
              ipv6_nd:
                ra:
                  disabled: true
          - nodes: ["BETA-EDGE-01"]
            interfaces: ["Ethernet1"]
            ip_addresses: ["198.51.100.5/31"]
            descriptions: ["TRANSIT-03 Peering"]
            structured_config:
              ipv6_enable: true
              ipv6_addresses:
                - "2603::1/127"
              ipv6_nd:
                ra:
                  disabled: true
          ############# END OF Transit Peering Point to Points ############
          ############# CG-NAT Appliance Point to Points ############
          - nodes: ["ALPHA-EDGE-01"]
            interfaces: ["Ethernet3.10"]
            ip_addresses: ["198.51.100.7/31"]
            descriptions: ["CG-NAT-01"]
          - nodes: ["BETA-EDGE-01"]
            interfaces: ["Ethernet3.10"]
            ip_addresses: ["198.51.100.9/31"]
            descriptions: ["CG-NAT-02"]
          ############# END OF CG-NAT Appliance Point to Points ############
        bgp_peer_groups:
          - name: "CGNAT_APPLIANCE_INTERNET_VRF"
            local_as: 3791
            remote_as: 65100
            default_originate:
              enabled: true
              always: true
            route_map_out: "DEFAULT_ONLY"
          - name: "PROVIDER"
            local_as: 3791
            address_family_ipv4:
              #rcf_in: "PROVIDER_OUT_V4(provider_routes_ipv4)"
              #rcf_out: "PROVIDER_OUT_V4(provider_routes_ipv4)"
        bgp_peers:
          ########### TRANSIT IPv4 PEERS ###########
          - nodes: ["ALPHA-EDGE-01"]
            peer_group: PROVIDER
            description: "AS1299 Arelion"
            ip_address: "198.51.100.0"
            shutdown: false
            remote_as: 1299
          - nodes: ["ALPHA-EDGE-01"]
            peer_group: PROVIDER
            description: "AS13760 Uniti"
            ip_address: "198.51.100.2"
            shutdown: false
            remote_as: 13760
          - nodes: ["BETA-EDGE-01"]
            peer_group: PROVIDER
            description: "AS2711 Segra"
            ip_address: "198.51.100.4"
            shutdown: false
            remote_as: 2711
          ########### TRANSIT IPv6 PEERS ###########
          - nodes: ["ALPHA-EDGE-01"]
            peer_group: PROVIDER
            description: "AS1299 Arelion"
            ip_address: "2601::0"
            shutdown: false
            remote_as: 1299
          - nodes: ["ALPHA-EDGE-01"]
            peer_group: PROVIDER
            description: "AS13760 Uniti"
            ip_address: "2602::0"
            shutdown: false
            remote_as: 13760
          - nodes: ["BETA-EDGE-01"]
            peer_group: PROVIDER
            description: "AS2711 Segra"
            ip_address: "2603::0"
            shutdown: false
            remote_as: 2711
          ########### CG-NAT APPLIANCES ###########
          - nodes: ["ALPHA-EDGE-01"]
            description: "CG-NAT-01 Port 1"
            peer_group: "CGNAT_APPLIANCE_INTERNET_VRF"
            ip_address: "198.51.100.6"
          - nodes: ["BETA-EDGE-01"]
            description: "CG-NAT-02 Port 1"
            shutdown: false
            peer_group: "CGNAT_APPLIANCE_INTERNET_VRF"
            ip_address: "198.51.100.8"
        # Subscriber DNS queries land here (default route via the CG-NAT appliance),
        # so INTERNET needs a real route to the DHCP vrf's subnet (192.168.100.0/24)
        # where the DNS server lives. DHCP vrf redistributes connected+static under
        # this RT (see ALPHA-PE-03's router_bgp), so a plain import is enough.
        additional_route_targets:
          - type: "import"
            address_family: "evpn"
            route_target: "65000:40000" # DHCP VRF
        # additional_route_targets:
        #   - type: "import"
        #     address_family: "evpn"
        #     route_target: "65000:50000" # CGNAT VRF
        #   - type: "import"
        #     address_family: "evpn"
        #     route_target: "rcf FILTER_INTERNET_IMPORTS()"
        svis:
          - id: 1001
            enabled: true
            profile: "PUBLIC DHCP"
            name: "PON_SHELF_SHARED_PUBLIC"
            ip_address_virtual: "2.3.4.1/24"
            ipv6_address_virtuals: ["2001:db8:8234:0000::1/64"]