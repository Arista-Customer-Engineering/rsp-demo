########################################################
# DHCP VRF & Server Connectivity
########################################################
services_dhcp_relay:
  - name: "DHCP Relay"
    mac_vrf_id_base: 40000
    vrfs:
      - name: "DHCP"
        structured_config:
          vrfs:
            - name: "DHCP"
              ipv6_routing: true
        description: "DHCP Relay VRF"
        address_families: ["evpn"]
        vrf_id: 40000
        redistribute_static: true
        vtep_diagnostic:
          loopback: 40
          loopback_description: "DHCP Relay Loopback"
          loopback_ip_range: 172.16.40.0/24
          loopback_ipv6_range: "2001:db8:8000:40::/64"
          hardware_forwarding: true
        l3_interfaces:
          - nodes: ["ALPHA-PE-03"]
            interfaces: ["Ethernet2"]
            ip_addresses: ["192.168.100.1/24"]
            descriptions: ["DHCP Server"]
            structured_config:
              ipv6_enable: true
              ipv6_addresses:
                - "2001:db8:8000:0002::1/64"
              ipv6_nd:
                ra:
                  disabled: true
        # INTERNET imports this vrf's RT so subscriber DNS queries (routed via the
        # CG-NAT appliance default route into INTERNET) can reach 192.168.100.10.
        # This vrf needs the reverse import so replies have a route back.
        additional_route_targets:
          - type: "import"
            address_family: "evpn"
            route_target: "65000:30000" # INTERNET VRF
