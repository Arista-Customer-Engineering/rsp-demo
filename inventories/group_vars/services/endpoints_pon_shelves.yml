endpoints_pon_shelves:
  - name: "PON_SHELF_BETA"
    adapters:
      - switches: [ "BETA-PE-01", "BETA-PE-02" ]
        switch_ports: [ "Ethernet2", "Ethernet2" ]
        endpoint_ports: [ "CARD A", "CARD B" ]
        sflow: true
        port_channel:
          description: "PON_TRUNK: PON_SHELF_BETA"
          mode: active
          structured_config:
            lacp_id: "3838.a600.0001"
          subinterfaces:
            - number: 1001 # Subinterface ID
              vlan_id: 1001  # services_cgnat SVI 1001
              short_esi: "{{ esi_PON_SHELF_BETA_PUBLIC }}"
              structured_config:
                description: "PON_SERVICE: PON_SHELF_BETA: PUBLIC"
                encapsulation_vlan:
                  client:
                    encapsulation: "dot1q"
                    vlan: 1001
                  network:
            - number: 1002 # Subinteface ID
              vlan_id: 1002 # services_cg_nat SVI 1002
              short_esi: "{{ esi_PON_SHELF_BETA_CGNAT }}"
              structured_config:
                description: "PON_SERVICE: PON_SHELF_BETA: CGNAT"
                encapsulation_vlan:
                  client:
                    encapsulation: "dot1q"
                    vlan: 1002
                  network:
            - number: 1003  # Subinterface ID
              vlan_id: 1003 # services_pon_mgmt SVI 1003
              short_esi: "{{ esi_PON_SHELF_BETA_MGMT }}"
              structured_config:
                description: "PON_SERVICE: PON_SHELF_BETA: Management"
                encapsulation_vlan:
                  client:
                    encapsulation: "dot1q"
                    vlan: 1003
                  network:

  - name: "PON_SHELF_OMNI"
