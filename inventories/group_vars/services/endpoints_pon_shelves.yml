          mode: active
          structured_config:
            lacp_id: "3838.a600.0001"
          subinterfaces:
            - number: 1001  # Subinterface ID
              vlan_id: 1001 # services_internet SVI 1004
              short_esi: "{{ esi_PON_SHELF_OMNI_PUBLIC }}"
              structured_config:
                description: "PON_SERVICE: PON_SHELF_OMNI: PUBLIC"
                encapsulation_vlan:
                  client:
                    encapsulation: "dot1q"
                    vlan: 1001
                  network:
            - number: 1004  # Subinterface ID
              vlan_id: 1004 # services_cg_nat SVI 1004
              short_esi: "{{ esi_PON_SHELF_OMNI_CGNAT }}"
              structured_config:
                description: "PON_SERVICE: PON_SHELF_OMNI: CGNAT"
                encapsulation_vlan:
                  client:
                    encapsulation: "dot1q"
                    vlan: 1004
                  network:
