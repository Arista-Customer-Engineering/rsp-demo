# TRANSIT/ALPHA-CG-NAT/BETA-CG-NAT are raw eos_cli_config_gen host_vars
# (see their own file headers) - they never go through eos_designs, so
# there's no inventories/intended/structured_configs/<hostname>.yml for
# them to read. This tells eos_cli_config_gen to read structured config
# straight from hostvars instead.
read_structured_config_from_file: false
