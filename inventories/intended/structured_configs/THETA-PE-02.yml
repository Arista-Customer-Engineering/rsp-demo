aaa_authentication:
  login:
    default: local
    console: local
aaa_authorization:
  exec:
    default: local
aaa_root:
  disabled: true
config_end: true
daemon_terminattr:
  cvaddrs:
  - apiserver.cv-staging.corp.arista.io:443
  cvauth:
    method: token-secure
    token_file: /mnt/flash/cv-onboarding-token
  cvvrf: OOB
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
enable_password:
  disabled: true
eos_cli: "platform tfa\n  interface mode relaying\n"
errdisable:
  recovery_interval: 30
ethernet_interfaces:
- name: Ethernet10
  description: P2P_DELTA-PE-02_Ethernet5
  shutdown: false
  channel_group:
    id: 10
    mode: active
  metadata:
    peer: DELTA-PE-02
    peer_interface: Ethernet5
    peer_type: pe
- name: Ethernet9
  description: P2P_THETA-PE-01_Ethernet9
  shutdown: false
  channel_group:
    id: 9
    mode: active
  metadata:
    peer: THETA-PE-01
    peer_interface: Ethernet9
    peer_type: pe
event_monitor:
