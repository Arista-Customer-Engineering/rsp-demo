    enabled: false
- name: Port-Channel9
  description: P2P_THETA-PE-01_Port-Channel9
  shutdown: false
  mtu: 9214
  mpls:
    ip: true
  isis_enable: CORE
  isis_metric: 1000
  isis_network_point_to_point: true
  isis_circuit_type: level-2
  isis_hello_padding: true
