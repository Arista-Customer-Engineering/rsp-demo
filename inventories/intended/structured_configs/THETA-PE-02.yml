prefix_lists:
- name: DEFAULT_ONLY
  sequence_numbers:
  - sequence: 10
    action: permit 0.0.0.0/0
- name: PROVIDER_ROUTES
  sequence_numbers:
  - sequence: 10
    action: permit 80.0.0.0/16 le 24
  - sequence: 20
    action: permit 81.0.0.0/16 le 24
  - sequence: 30
    action: permit 82.0.0.0/16 le 24
route_maps:
- name: DEFAULT_ONLY
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list DEFAULT_ONLY
  - sequence: 20
    type: deny
- name: PROVIDER_ROUTES_ONLY
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PROVIDER_ROUTES
  - sequence: 20
    type: deny
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65000'
  router_id: 172.16.0.13
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MPLS-OVERLAY-PEERS
    metadata:
      type: mpls
    remote_as: '65000'
    update_source: Loopback0
    bfd: false
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 172.16.0.1
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: ALPHA-EDGE-01
    description: ALPHA-EDGE-01_Loopback0
  - ip_address: 172.16.0.2
