  mtu: 9214
  mpls:
    ip: true
  isis_enable: CORE
  isis_metric: 1000
  isis_network_point_to_point: true
  isis_circuit_type: level-2
  isis_hello_padding: true
  isis_authentication:
    both:
      key_type: '7'
