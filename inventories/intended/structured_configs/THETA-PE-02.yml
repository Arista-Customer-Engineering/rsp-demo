      peer: THETA-PE-01
    description: THETA-PE-01_Loopback0
  address_family_evpn:
    neighbor_default:
      encapsulation: mpls
      next_hop_self_source_interface: Loopback0
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
  address_family_rtc:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MPLS-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: DHCP
    rd: 172.16.0.13:40000
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 65000:40000
        - 65000:30000
      export:
