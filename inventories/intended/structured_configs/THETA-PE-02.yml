    description: ALPHA-PE-02_Loopback0
  - ip_address: 172.16.0.5
    peer_group: MPLS-OVERLAY-PEERS
    metadata:
      peer: ALPHA-PE-03
    description: ALPHA-PE-03_Loopback0
  - ip_address: 172.16.0.6
