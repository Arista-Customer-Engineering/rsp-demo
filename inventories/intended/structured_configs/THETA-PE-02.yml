local_users:
- name: admin
  privilege: 15
  role: network-admin
  sha512_password: $6$n5UzLR7bucITZ.fE$BoS3AU71MBIDlSsWb1NpH0P62l9AyanxImmA.9OKesBuClBXXae3oMf0fm1HA.3rxwzvbkbVl.QarZAHgm7V81
- name: dave.watkins
  privilege: 15
  role: network-admin
  sha512_password: $6$n5UzLR7bucITZ.fE$BoS3AU71MBIDlSsWb1NpH0P62l9AyanxImmA.9OKesBuClBXXae3oMf0fm1HA.3rxwzvbkbVl.QarZAHgm7V81
logging:
  console: disabled
  buffered:
    size: 64000
    level: debugging
  synchronous:
    level: debugging
  format:
    timestamp: high-resolution
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 172.16.0.13/32
  isis_enable: CORE
  isis_passive: true
  node_segment:
    ipv4_index: 13
- name: Loopback40
  description: DHCP Relay Loopback
  shutdown: false
  vrf: DHCP
  ip_address: 172.16.40.13/32
  ipv6_addresses:
  - 2001:db8:8000:40::d/128
  hardware_forwarding_id: true
- name: Loopback2
  description: '[LOOPBACK_SVC]: Inband Management Loopback'
  shutdown: false
  vrf: INBAND_MGMT
  ip_address: 172.16.2.13/32
  hardware_forwarding_id: true
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: OOB
management_console:
  idle_timeout: 60
management_interfaces:
- name: Management0
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: OOB
  ip_address: 192.168.128.13/24
  type: oob
  gateway: 192.168.128.254
  eos_cli: 'no lldp transmit

    no lldp receive

    '
management_ssh:
  idle_timeout: 15
  enable: false
  vrfs:
  - name: default
    enable: true
  - name: OOB
    enable: true
management_tech_support:
  policy_show_tech_support:
    exclude_commands:
    - command: show platform fap ipv6 route
    - command: show ipv6 bgp vrf all
    - command: show ipv6 route vrf all detail
metadata:
  is_deployed: true
  platform: 7280SR3
  dc_name: RSP
  fabric_name: mpls
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: RSP
    - name: topology_hint_fabric
      value: mpls
    - name: topology_hint_rack
      value: Limited Routes
mpls:
  ip: true
ntp:
  servers:
  - name: 192.5.41.209
    preferred: true
  - name: 192.5.41.40
  - name: 192.5.41.41
  vrf: OOB
port_channel_interfaces:
