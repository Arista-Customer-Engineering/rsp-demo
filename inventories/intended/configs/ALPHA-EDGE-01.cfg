      route-target export evpn 65000:40000
      router-id 172.16.0.1
      redistribute connected
      redistribute static
   !
   vrf INBAND_MGMT
      rd 172.16.0.1:0
      route-target import evpn 65000:0
      route-target export evpn 65000:0
      router-id 172.16.0.1
      redistribute connected
      redistribute static
   !
   vrf INTERNET
      rd 172.16.0.1:30000
      route-target import evpn 65000:30000
      route-target import evpn 65000:40000
      route-target export evpn 65000:30000
      router-id 172.16.0.1
      neighbor 198.51.100.0 peer group PROVIDER
      neighbor 198.51.100.0 remote-as 1299
      neighbor 198.51.100.0 description AS1299 Arelion
      neighbor 198.51.100.2 peer group PROVIDER
      neighbor 198.51.100.2 remote-as 13760
      neighbor 198.51.100.2 description AS13760 Uniti
      neighbor 198.51.100.6 peer group CGNAT_APPLIANCE_INTERNET_VRF
      neighbor 198.51.100.6 description CG-NAT-01 Port 1
      neighbor 2601::0 peer group PROVIDER
      neighbor 2601::0 remote-as 1299
      neighbor 2601::0 description AS1299 Arelion
      neighbor 2602::0 peer group PROVIDER
      neighbor 2602::0 remote-as 13760
      neighbor 2602::0 description AS13760 Uniti
      redistribute connected
      redistribute static
      !
      address-family ipv4
         neighbor 198.51.100.0 activate
         neighbor 198.51.100.2 activate
         neighbor 198.51.100.6 activate
      !
      address-family ipv6
         neighbor 2601::0 activate
         neighbor 2602::0 activate
