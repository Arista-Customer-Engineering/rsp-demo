router bgp 65000
   router-id 172.16.0.1
   no bgp default ipv4-unicast
   bgp cluster-id 172.16.0.0
   maximum-paths 4
   neighbor CGNAT_APPLIANCE_CGNAT_VRF peer group
   neighbor CGNAT_APPLIANCE_CGNAT_VRF remote-as 65100
   neighbor CGNAT_APPLIANCE_CGNAT_VRF local-as 64496 no-prepend replace-as
   neighbor CGNAT_APPLIANCE_CGNAT_VRF route-map DEFAULT_ONLY in
   neighbor CGNAT_APPLIANCE_CGNAT_VRF default-originate always
   neighbor CGNAT_APPLIANCE_INTERNET_VRF peer group
   neighbor CGNAT_APPLIANCE_INTERNET_VRF remote-as 65100
   neighbor CGNAT_APPLIANCE_INTERNET_VRF local-as 3791 no-prepend replace-as
   neighbor CGNAT_APPLIANCE_INTERNET_VRF route-map DEFAULT_ONLY out
   neighbor CGNAT_APPLIANCE_INTERNET_VRF default-originate always
   neighbor MPLS-OVERLAY-PEERS peer group
   neighbor MPLS-OVERLAY-PEERS remote-as 65000
   neighbor MPLS-OVERLAY-PEERS update-source Loopback0
   neighbor MPLS-OVERLAY-PEERS route-reflector-client
   neighbor MPLS-OVERLAY-PEERS send-community
   neighbor MPLS-OVERLAY-PEERS maximum-routes 0
   neighbor PROVIDER peer group
   neighbor PROVIDER local-as 3791 no-prepend replace-as
   neighbor RR-OVERLAY-PEERS peer group
   neighbor RR-OVERLAY-PEERS remote-as 65000
   neighbor RR-OVERLAY-PEERS update-source Loopback0
   neighbor RR-OVERLAY-PEERS send-community
   neighbor RR-OVERLAY-PEERS maximum-routes 0
   neighbor 172.16.0.2 peer group RR-OVERLAY-PEERS
   neighbor 172.16.0.2 description BETA-EDGE-01_Loopback0
   neighbor 172.16.0.3 peer group MPLS-OVERLAY-PEERS
   neighbor 172.16.0.3 description ALPHA-PE-01_Loopback0
   neighbor 172.16.0.4 peer group MPLS-OVERLAY-PEERS
   neighbor 172.16.0.4 description ALPHA-PE-02_Loopback0
   neighbor 172.16.0.5 peer group MPLS-OVERLAY-PEERS
   neighbor 172.16.0.5 description ALPHA-PE-03_Loopback0
   neighbor 172.16.0.6 peer group MPLS-OVERLAY-PEERS
   neighbor 172.16.0.6 description BETA-PE-01_Loopback0
   neighbor 172.16.0.7 peer group MPLS-OVERLAY-PEERS
   neighbor 172.16.0.7 description BETA-PE-02_Loopback0
   neighbor 172.16.0.8 peer group MPLS-OVERLAY-PEERS
   neighbor 172.16.0.8 description GAMMA-PE-01_Loopback0
   neighbor 172.16.0.9 peer group MPLS-OVERLAY-PEERS
   neighbor 172.16.0.9 description GAMMA-PE-02_Loopback0
   neighbor 172.16.0.10 peer group MPLS-OVERLAY-PEERS
   neighbor 172.16.0.10 description DELTA-PE-01_Loopback0
   neighbor 172.16.0.11 peer group MPLS-OVERLAY-PEERS
   neighbor 172.16.0.11 description DELTA-PE-02_Loopback0
   neighbor 172.16.0.12 peer group MPLS-OVERLAY-PEERS
   neighbor 172.16.0.12 description THETA-PE-01_Loopback0
   neighbor 172.16.0.13 peer group MPLS-OVERLAY-PEERS
   neighbor 172.16.0.13 description THETA-PE-02_Loopback0
   !
   address-family evpn
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
      neighbor MPLS-OVERLAY-PEERS activate
      neighbor RR-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor MPLS-OVERLAY-PEERS activate
      no neighbor RR-OVERLAY-PEERS activate
   !
   address-family rt-membership
      neighbor MPLS-OVERLAY-PEERS activate
      neighbor MPLS-OVERLAY-PEERS default-route-target only
   !
   vrf CGNAT
      rd 172.16.0.1:50000
      route-target import evpn 65000:50000
      route-target export evpn 65000:50000
      router-id 172.16.0.1
      neighbor 198.51.100.14 peer group CGNAT_APPLIANCE_CGNAT_VRF
      neighbor 198.51.100.14 description CG-NAT-01 Port 1
      redistribute connected
      !
      address-family ipv4
         neighbor 198.51.100.14 activate
   !
   vrf DHCP
      rd 172.16.0.1:40000
      route-target import evpn 65000:40000
