username dave.watkins privilege 15 role network-admin secret sha512 $6$n5UzLR7bucITZ.fE$BoS3AU71MBIDlSsWb1NpH0P62l9AyanxImmA.9OKesBuClBXXae3oMf0fm1HA.3rxwzvbkbVl.QarZAHgm7V81
!
event-monitor
!
load-interval default 1
!
hostname OMNI-PON-01
!
vlan 1001
   name PUBLIC_DATA
   state active
!
vlan 1002
   name CGNAT_DATA
   state active
!
vlan 1003
   name MGMT
   state active
!
vrf instance DATA
   description Customer CPE Data
!
vrf instance OOB
   description Out of Band
!
vrf instance PON_MGMT
   description PON Shelf Management
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf OOB
      no shutdown
!
interface Ethernet1
   description DELTA-PE-02 Uplink
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description GAMMA-PE-01 Uplink
   no shutdown
   channel-group 1 mode active
!
interface Ethernet3
   description PUBLIC-CUSTOMER
   no shutdown
   switchport access vlan 1001
   switchport mode access
   switchport
!
interface Ethernet4
   description CGNAT-CUSTOMER
   no shutdown
   switchport access vlan 1002
   switchport mode access
   switchport
!
interface Port-Channel1
   description PON SHELF EVPN A/A UPLINK
   no shutdown
   no switchport
!
interface Port-Channel1.1001
   description CPE PUBLIC
   vlan id 1001
   encapsulation vlan
      client dot1q 1001
!
interface Port-Channel1.1002
   description CPE CGNAT
   vlan id 1002
   encapsulation vlan
      client dot1q 1002
!
interface Port-Channel1.1003
   description PON Management
   vlan id 1003
   encapsulation vlan
      client dot1q 1003
