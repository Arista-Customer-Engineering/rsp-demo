- name: Build EOS Designs for MPLS Only
  hosts: mpls
  gather_facts: false
  tasks:
    - name: Generate intended variables
      ansible.builtin.import_role:
        name: arista.avd.eos_designs
- name: Build and Deploy All Host Configs
  hosts: mpls
  gather_facts: false
  tasks:
    - name: Generate device intended config and documentation
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen
    - name: Deploy configurations and tags to CloudVision
      ansible.builtin.import_role:
        name: arista.avd.cv_deploy
      vars:
        cv_server: www.cv-staging.corp.arista.io
        cv_token: "{{ lookup('file', 'avd.tok') }}"
        cv_submit_workspace: false
