# DHCPv6 prefix delegation for CPE nodes
# Request a /56 IA_PD on eth1
denyinterfaces eth0
noipv4
# dhcpcd manages /etc/resolv.conf globally by default, even with noipv4 set -
# if its own DHCPv6/RA lease carries no DNS servers, it overwrites (blanks)
# whatever udhcpc's IPv4 lease already put there. Leave resolv.conf to udhcpc.
nohook resolv.conf
interface eth1
    ia_na 1
    ia_pd 1/::/56
