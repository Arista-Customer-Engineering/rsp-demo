{
  "Dhcp6": {

    // Listen on the link toward ALPHA-PE-03 (eth1).
    // DHCPv6 relay agents on the PE/PON nodes forward subscriber SOLICIT messages here.
    "interfaces-config": {
      "interfaces": ["eth1", "eth1/2001:db8:8000:2::100"],
      "service-sockets-max-retries": 120,
      "service-sockets-retry-wait-time": 5000
    },

    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/dhcp6.leases",
      "lfc-interval": 3600
    },

    // Global options
    "option-data": [
      { "name": "dns-servers", "data": "2001:db8:8000:2::100" },
      { "name": "domain-search", "data": "lab.local" }
    ],

    "subnet6": [

      // ---------------------------------------------------------------
      // BETA-PON-01 subscriber pool
      //   - IA_NA: individual addresses from 2001:db8:8002::/64
      //   - IA_PD: /56 delegated prefixes carved from 2001:db8:8002::/48
      //            (typical ISP pattern: customer CPE gets a /56 to
      //             sub-allocate LAN segments)
      // Relay source: Loopback40 (vrf DHCP) on BETA-PE-01 and BETA-PE-02
      // ---------------------------------------------------------------
      {
        "id": 10,
        "subnet": "2001:db8:8002::/48",
        "pools": [
          { "pool": "2001:db8:8002::10 - 2001:db8:8002::ffff" }
        ],
        "pd-pools": [
          {
            "prefix": "2001:db8:8002:1000::",
            "prefix-len": 52,
            "delegated-len": 56
          }
        ],
        "relay": {
          "ip-addresses": ["2001:db8:8000:40::6", "2001:db8:8000:40::7"]
        },
        "preferred-lifetime": 43200,
        "valid-lifetime":     86400,
        "renew-timer":        21600,
        "rebind-timer":       37800
      },

      // ---------------------------------------------------------------
      // OMNI-PON-01 subscriber pool
      // Relay source: Loopback40 (vrf DHCP) on DELTA-PE-02 and GAMMA-PE-01
      // ---------------------------------------------------------------
      {
        "id": 20,
        "subnet": "2001:db8:8002:1::/48",
        "pools": [
          { "pool": "2001:db8:8002:1::10 - 2001:db8:8002:1::ffff" }
        ],
        "pd-pools": [
          {
            "prefix": "2001:db8:8002:2000::",
            "prefix-len": 52,
            "delegated-len": 56
          }
        ],
        "relay": {
          "ip-addresses": ["2001:db8:8000:40::b", "2001:db8:8000:40::8"]
        },
        "preferred-lifetime": 43200,
        "valid-lifetime":     86400,
        "renew-timer":        21600,
        "rebind-timer":       37800
      }

    ],

    "loggers": [
      {
        "name": "kea-dhcp6",
        "output_options": [
          { "output": "stdout" }
        ],
        "severity": "INFO"
      }
    ]
  }
}
