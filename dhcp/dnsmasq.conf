# --------------------------------------------------------------------
# Lab DNS — dnsmasq DNS-only mode
#
# Maps well-known service names to real public IPs whose PTR records
# are already in public DNS. CloudVision resolves those PTRs
# independently, so sFlow analytics show real company names.
#
# TRANSIT must have a static /32 route for each IP below pointing
# at TRAFFIC-GEN's interface address (198.51.100.7).
#
# IP → PTR (as resolved by public DNS)
#   8.8.8.8         → dns.google          (YouTube / Google)
#   45.57.0.1        Netflix's own AS2906 space (no public PTR trick)
#   1.1.1.1         → one.one.one.one     (Discord / Cloudflare CDN)
#   8.8.4.4         → dns.google          (general web browsing)
#   208.67.222.222  → resolver1.opendns.com  (Xbox Live / gaming)
#   9.9.9.9         → dns9.quad9.net      (Zoom / VoIP)
# --------------------------------------------------------------------

interface=eth1
bind-interfaces

# Self-contained — do not forward to upstream resolvers
no-resolv
no-poll

# --------------------------------------------------------------------
# YouTube / Google  →  8.8.8.8
# --------------------------------------------------------------------
address=/youtube.com/8.8.8.8
address=/googlevideo.com/8.8.8.8
address=/ytimg.com/8.8.8.8
address=/googleapis.com/8.8.8.8
address=/gstatic.com/8.8.8.8
address=/google.com/8.8.8.8
address=/ggpht.com/8.8.8.8

# --------------------------------------------------------------------
# Netflix  →  45.57.0.1 (Netflix's own AS2906 space)
# --------------------------------------------------------------------
address=/netflix.com/45.57.0.1
address=/nflxvideo.net/45.57.0.1
address=/nflximg.net/45.57.0.1
address=/nflxext.com/45.57.0.1

# --------------------------------------------------------------------
# Cloudflare-fronted apps  →  1.1.1.1
# --------------------------------------------------------------------
address=/cloudflare.com/1.1.1.1
address=/cfvideo.net/1.1.1.1
address=/discord.com/1.1.1.1
address=/discordapp.com/1.1.1.1

# --------------------------------------------------------------------
# General web browsing (Apple / iCloud / social)  →  8.8.4.4
# Bursty short-lived flows, TCP/443 and TCP/80
# --------------------------------------------------------------------
address=/apple.com/8.8.4.4
address=/icloud.com/8.8.4.4
address=/facebook.com/8.8.4.4
address=/instagram.com/8.8.4.4
address=/twitter.com/8.8.4.4
address=/x.com/8.8.4.4
address=/reddit.com/8.8.4.4

# --------------------------------------------------------------------
# Xbox Live / gaming  →  208.67.222.222
# UDP/3074 sustained, small packets
# --------------------------------------------------------------------
address=/xbox.com/208.67.222.222
address=/xboxlive.com/208.67.222.222
address=/xsts.auth.xboxlive.com/208.67.222.222
address=/live.com/208.67.222.222

# --------------------------------------------------------------------
# Zoom VoIP  →  9.9.9.9
# UDP/8801, G.711 profile (160-byte frames, ~50 pps)
# --------------------------------------------------------------------
address=/zoom.us/9.9.9.9
address=/zoomvideo.com/9.9.9.9
address=/zoom.com/9.9.9.9
address=/zmvideo.com/9.9.9.9

# --------------------------------------------------------------------
# Log queries to stdout (docker logs ALPHA-DHCP)
# --------------------------------------------------------------------
log-queries
log-facility=-
