{
  "Dhcp4": {

    // Listen on the link toward ALPHA-PE-03 (eth1).
    // Relay agents on the PE/PON nodes forward subscriber DISCOVER messages here.
    "interfaces-config": {
      "interfaces": ["eth1"],
      "service-sockets-max-retries": 10,
      "service-sockets-retry-wait-time": 5000
    },

    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/dhcp4.leases",
      "lfc-interval": 3600
    },

    // Global options sent to all clients unless overridden per-subnet
    "option-data": [
      { "name": "domain-name-servers", "data": "192.168.100.10" },
      { "name": "domain-name",         "data": "lab.local" }
    ],

    "subnet4": [

      // ---------------------------------------------------------------
      // BETA-PON-01 subscriber pool
      // Relay: set "relay" -> "ip-address" to the helper-address
      //        configured on the BETA-PE-01/02 facing BETA-PON-01
      //        (the ip helper-address source IP on the relay interface).
      // ---------------------------------------------------------------
      {
        "id": 10,
        "subnet": "100.64.0.1/22",
        "pools": [
          { "pool": "100.64.0.10 - 100.64.3.250" }
        ],
        "option-data": [
          { "name": "routers",            "data": "100.64.0.1" },
          { "name": "broadcast-address",  "data": "100.64.3.255" },
          { "name": "ip-forwarding",      "data": "false" }
        ],
        "relay": {
          "ip-addresses": ["172.16.40.6", "172.16.40.7"]
        },
        "valid-lifetime": 86400,
        "renew-timer":    43200,
        "rebind-timer":   75600
      },

      // ---------------------------------------------------------------
      // PUBLIC subscriber pool (shared across all PON shelves)
      // Matched via RFC 3527 link-selection from INTERNET VRF SVIs
      // ---------------------------------------------------------------
      {
        "id": 30,
        "subnet": "2.3.4.0/24",
        "pools": [
          { "pool": "2.3.4.10 - 2.3.4.250" }
        ],
        "option-data": [
          { "name": "routers",            "data": "2.3.4.1" },
          { "name": "broadcast-address",  "data": "2.3.4.255" },
          { "name": "ip-forwarding",      "data": "false" }
        ],
        "relay": {
          "ip-addresses": ["172.16.40.6", "172.16.40.7", "172.16.40.11", "172.16.40.8"]
        },
        "valid-lifetime": 86400,
        "renew-timer":    43200,
        "rebind-timer":   75600
      },

      // ---------------------------------------------------------------
      // OMNI-PON-01 subscriber pool
      // Relay: set "relay" -> "ip-address" to the helper-address
      //        configured on the DELTA-PE-02 / GAMMA-PE-01 facing OMNI-PON-01
      // ---------------------------------------------------------------
      {
        "id": 20,
        "subnet": "100.64.4.1/22",
        "pools": [
          { "pool": "100.64.4.10 - 100.64.7.250" }
        ],
        "option-data": [
          { "name": "routers",            "data": "100.64.4.1" },
          { "name": "broadcast-address",  "data": "100.64.7.255" },
          { "name": "ip-forwarding",      "data": "false" }
        ],
        "relay": {
          "ip-addresses": ["172.16.40.11", "172.16.40.8"]
        },
        "valid-lifetime": 86400,
        "renew-timer":    43200,
        "rebind-timer":   75600
      }

    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          { "output": "stdout" }
        ],
        "severity": "INFO"
      }
    ]
  }
}
